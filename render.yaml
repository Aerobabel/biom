projects:
  - name: MVP
    environments:
      - name: Production
        services:
          - type: web
            name: biom
            runtime: node
            plan: free
            region: frankfurt
            buildCommand: npm ci --include=dev && npm run check && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: 22.16.0
              - key: DATABASE_URL
                fromDatabase:
                  name: biom-db
                  property: connectionString
              - key: ADMIN_EMAIL
                sync: false
        databases:
          - name: biom-db
            plan: free
            region: frankfurt
            databaseName: biom
            user: biom
